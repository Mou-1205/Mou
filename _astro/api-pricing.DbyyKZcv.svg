<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="820" height="420" fill="#fafafa"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#111">API 定价（USD / 百万 tokens）</text>
  <text x="410" y="52" text-anchor="middle" font-size="12" fill="#666">与 V2.5 持平 · UltraSpeed 输出价 10× 换 20× 速度 · 来源：官方发布稿</text>

  <!-- Group titles at top of each cluster, clear of bars -->
  <text x="150" y="95" font-size="15" font-weight="600" fill="#059669" text-anchor="middle">Flash</text>
  <text x="410" y="95" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">Pro</text>
  <text x="670" y="95" font-size="15" font-weight="600" fill="#7c3aed" text-anchor="middle">Pro-UltraSpeed</text>

  <!-- baseline -->
  <line x1="60" y1="360" x2="780" y2="360" stroke="#ddd"/>
  <!-- scale: max 8.7 -> 230px. h = v/8.7*230. sqrt used before caused confusion; use linear with value labels -->
  <!-- Flash: 0.0028→0.1, 0.14→3.7, 0.28→7.4 ; use min height 8 for tiny -->
  <!-- Actually use sqrt scale but put VALUE LABELS ABOVE BAR TOP with enough gap -->

  <!-- Flash bars: x 90,140,190 width 40 -->
  <!-- sqrt scale: h = 230 * sqrt(v/8.7) -->
  <!-- 0.0028 -> 230*0.018=4 -> use 10 min -->
  <!-- 0.14 -> 230*0.127=29 -->
  <!-- 0.28 -> 230*0.179=41 -->
  <rect x="90" y="350" width="40" height="10" rx="3" fill="#bbf7d0"/>
  <text x="110" y="342" font-size="11" fill="#059669" text-anchor="middle" font-weight="600">0.0028</text>
  <rect x="140" y="331" width="40" height="29" rx="3" fill="#6ee7b7"/>
  <text x="160" y="323" font-size="11" fill="#059669" text-anchor="middle" font-weight="600">0.14</text>
  <rect x="190" y="319" width="40" height="41" rx="3" fill="#059669"/>
  <text x="210" y="311" font-size="11" fill="#059669" text-anchor="middle" font-weight="600">0.28</text>
  <text x="110" y="380" font-size="11" fill="#888" text-anchor="middle">缓存命中</text>
  <text x="160" y="380" font-size="11" fill="#888" text-anchor="middle">未命中</text>
  <text x="210" y="380" font-size="11" fill="#888" text-anchor="middle">输出</text>

  <!-- Pro: 0.0036->11, 0.435->73, 0.87->103 -->
  <rect x="350" y="349" width="40" height="11" rx="3" fill="#bfdbfe"/>
  <text x="370" y="341" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">0.0036</text>
  <rect x="400" y="287" width="40" height="73" rx="3" fill="#60a5fa"/>
  <text x="420" y="279" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">0.435</text>
  <rect x="450" y="257" width="40" height="103" rx="3" fill="#2563eb"/>
  <text x="470" y="249" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">0.87</text>
  <text x="370" y="380" font-size="11" fill="#888" text-anchor="middle">缓存命中</text>
  <text x="420" y="380" font-size="11" fill="#888" text-anchor="middle">未命中</text>
  <text x="470" y="380" font-size="11" fill="#888" text-anchor="middle">输出</text>

  <!-- Ultra: 0.036->30, 4.35->165, 8.7->230 -->
  <!-- Value labels ABOVE bars, but title is at y=95 so bar tops must be below 115 -->
  <!-- 8.7 bar height 230 -> top at 130. label at 122. title at 95. OK gap -->
  <rect x="610" y="330" width="40" height="30" rx="3" fill="#ddd6fe"/>
  <text x="630" y="322" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="600">0.036</text>
  <rect x="660" y="195" width="40" height="165" rx="3" fill="#a78bfa"/>
  <text x="680" y="187" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="600">4.35</text>
  <rect x="710" y="130" width="40" height="230" rx="3" fill="#7c3aed"/>
  <text x="730" y="122" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="600">8.7</text>
  <text x="630" y="380" font-size="11" fill="#888" text-anchor="middle">缓存命中</text>
  <text x="680" y="380" font-size="11" fill="#888" text-anchor="middle">未命中</text>
  <text x="730" y="380" font-size="11" fill="#888" text-anchor="middle">输出</text>

  <text x="410" y="408" text-anchor="middle" font-size="11" fill="#999">柱高经平方根压缩以便同图阅读 · 标注为真实价格</text>
</svg>
